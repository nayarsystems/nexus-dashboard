# Local development — the ONLY thing the host needs is docker.
#
#   docker compose up dev      # ng serve + hot reload on http://localhost:4200
#   docker compose build dev   # refresh dependencies after package.json changes
services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "4200:4200"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./angular.json:/app/angular.json:ro
      - node_modules:/app/node_modules

volumes:
  node_modules:
