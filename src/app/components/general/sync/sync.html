<mat-card>
  <mat-card-content>
    <mat-table #table [dataSource]="dataSource">
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef translate> Unlock </mat-header-cell>
        <mat-cell *matCellDef="let row">
          @if (!row.lock) {
            <button mat-icon-button type="button" (click)="unlock(row)">
              <mat-icon>lock_open</mat-icon>
            </button>
          }
          @if (row.lock) {
            <button mat-icon-button type="button" (click)="lock()">
              <mat-icon>lock_outline</mat-icon>
            </button>
          }
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef style="flex: 3;" translate> Name </mat-header-cell>
        <mat-cell *matCellDef="let row" style="flex: 3;">
          @if (!row.lock) {
            <span>{{ row }}</span>
          }
          @if (row.lock) {
            <span>
              <mat-form-field>
                <input matInput [placeholder]="'New lock' | translate" [formControl]="newLock" />
              </mat-form-field>
            </span>
          }
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
  </mat-card-content>
</mat-card>
