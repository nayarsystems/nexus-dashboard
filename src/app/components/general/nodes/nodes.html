<mat-card>
  <mat-card-content>
    <mat-table #table [dataSource]="dataSource">
      <ng-container matColumnDef="node">
        <mat-header-cell *matHeaderCellDef translate> Node </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.NodeId }} </mat-cell>
      </ng-container>

      <ng-container matColumnDef="version">
        <mat-header-cell *matHeaderCellDef translate> Version </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.Version }} </mat-cell>
      </ng-container>

      <ng-container matColumnDef="clients">
        <mat-header-cell *matHeaderCellDef translate> Clients </mat-header-cell>
        <mat-cell *matCellDef="let row"> {{ row.Clients }} </mat-cell>
      </ng-container>

      <ng-container matColumnDef="listening">
        <mat-header-cell *matHeaderCellDef translate> Listening </mat-header-cell>
        <mat-cell *matCellDef="let row">
          @if (row.Listening) {
            <mat-icon>check_circle</mat-icon>
          }
          @if (!row.Listening) {
            <mat-icon>cancel</mat-icon>
          }
        </mat-cell>
      </ng-container>

      <ng-container matColumnDef="load">
        <mat-header-cell *matHeaderCellDef style="flex: 2;" translate> Load </mat-header-cell>
        <mat-cell *matCellDef="let row" style="flex: 2;"> {{ formatLoadFn(row.Load) }} </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table>
  </mat-card-content>
</mat-card>
